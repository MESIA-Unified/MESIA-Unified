name: Secret scan

# This repository intentionally holds NO secrets of any kind. The scan
# exists to catch credentials, keys, or other sensitive material that is
# committed by accident.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so gitleaks can scan the full history, not just the
      # tip commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        # If this repository ever moves under a GitHub organization
        # account, a free GITLEAKS_LICENSE secret must be added for
        # gitleaks-action to run. Personal-account repos do not need it.
