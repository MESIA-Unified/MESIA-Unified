name: Markdown lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # markdownlint-cli2 automatically picks up the .markdownlint.json
      # config file at the repository root.
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"
