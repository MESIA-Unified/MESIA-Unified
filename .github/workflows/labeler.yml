name: PR labeler

# Runs on pull_request (never pull_request_target) with the minimum
# permissions needed to apply labels. No code from the PR is checked out
# or executed.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # actions/labeler@v5 reads .github/labeler.yml from the repository
      # via the GitHub API, so no checkout step is required.
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
