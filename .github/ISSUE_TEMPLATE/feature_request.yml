name: Feature request
description: Suggest an improvement to the public content or the general direction of MESIA Unified.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Note that this repository covers the project's
        **public content and general direction** — the engine itself is
        private and its feature work is tracked internally.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or gap does this request address?
      placeholder: "It is hard to find ... because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about, or reasons existing content does not cover this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the public content does this concern?
      options:
        - docs
        - status
        - faq
        - roadmap
        - other
    validations:
      required: true

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Acknowledgment
      options:
        - label: "I understand that feature requests for the private engine are tracked internally, and that public repo issues cover public content and general direction."
          required: true
